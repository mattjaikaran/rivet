# Local dependencies for Rivet development.
# Start them with `make dev` (or `docker compose --profile dev up -d`).

services:
  postgres:
    image: postgres:18-alpine
    container_name: rivet-postgres
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: rivet
      POSTGRES_DB: rivet_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    profiles: [dev]

  redis:
    image: redis:7-alpine
    container_name: rivet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles: [dev]

volumes:
  pg_data:
  redis_data:
