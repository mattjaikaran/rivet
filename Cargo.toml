[workspace]
resolver = "2"
members = [
    "constraint-tools",
    "rivet-core",
    "rivet-cli",
    "rivet-plugin-api",
    # The example plugin is a member so its tests run with the workspace.
    "examples/basic/plugins/auth-token",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["mattjaikaran"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattjaikaran/rivet"
readme = "README.md"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# Comment-preserving `rivet.toml` edits (phase 4): `rivet add plugin`
# rewrites one table and leaves every other line as it was.
toml_edit = "0.22"

# CLI and error handling
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Language parsing (Python DSL front end)
tree-sitter = "0.27"
tree-sitter-python = "0.25"

# MCP server (phase 3, pillar 09): the official Rust SDK for the Model
# Context Protocol (github.com/modelcontextprotocol/rust-sdk). The `server`,
# `macros`, and `transport-io` features give the tool macros, the server
# service, and the stdio transport the `rivet mcp` command serves on.
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-io"] }

# HTTP for the /plan provider call (phase 3, pillar 09): rustls, no
# native TLS, so the build stays portable. Already in the tree via lancedb.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTTP layer for plugins (phase 4): the plugin API passes `axum::Router`
# values between crates, and plugin tests drive their routes through
# `tower`'s `ServiceExt::oneshot`, which needs the `util` feature.
axum = "0.8"
tower = { version = "0.5", default-features = false, features = ["util"] }

# HTTP/1 upgrade plumbing for the `rivet dev` HMR tunnel (phase 4, pillar
# 03): `hyper` names the server-side `OnUpgrade` handle, and `hyper-util`
# adapts the upgraded connection to the tokio I/O traits that
# `copy_bidirectional` needs. Both crates are already in the tree through
# axum.
hyper = { version = "1.11", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# Each later phase adds the crates it needs here. Keep this table limited
# to dependencies that at least one workspace member actually uses.
