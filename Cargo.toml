[workspace]
resolver = "2"
members = [
    "rivet-core",
    "rivet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rivet"
readme = "README.md"

[workspace.dependencies]
# Core runtime
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
hyper = "1.4"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate"] }
pgvector = "0.3"

# Parsing (tree-sitter)
tree-sitter = "0.22"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console = "0.15"
indicatif = "0.17"
ratatui = "0.26"
crossterm = "0.28"

# Algorithms & Data Structures
petgraph = "0.6"
lru = "0.12"
bloom = "0.4"
matchit = "0.7"

# WASM & FFI
wasmtime = "21.0"
uniffi = { version = "0.28", optional = true }

# Dev tools
cargo-mutants = "24.0"  # Used in the Gauntlet