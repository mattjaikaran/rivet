[workspace]
resolver = "2"
members = [
    "constraint-tools",
    "rivet-core",
    "rivet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["mattjaikaran"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattjaikaran/rivet"
readme = "README.md"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# CLI and error handling
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Language parsing (Python DSL front end)
tree-sitter = "0.27"
tree-sitter-python = "0.25"

# Each later phase adds the crates it needs here. Keep this table limited
# to dependencies that at least one workspace member actually uses.
