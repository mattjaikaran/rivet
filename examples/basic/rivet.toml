# Rivet example project used by the phase-0 smoke test.
[project]
name = "basic"
description = "Basic Rivet application (ping + echo)"

[environments]
development = { host = "127.0.0.1", port = 3000, log_level = "debug" }

# Phase 4: compose the auth-token plugin into the generated app at compile
# time. `rivet add plugin auth-token --path plugins/auth-token` writes this
# entry; `rivet build` then adds the dependency and the install call.
[plugins.auth-token]
path = "plugins/auth-token"

# Phase 4: the production frontend build `rivet build` compiles into the
# binary (pillar 03). The fixture under `dist/` stands in for a real Vite or
# Rsbuild output.
[frontend]
dist = "dist"

# Phase 4: the built-in route-table panel. `rivet build` compiles the panel
# into the binary and mounts it under `/__rivet/`.
[admin]
enabled = true

# Phase 5: the Rust capabilities this project opts into. `const_generics`
# renders `List[T, N]` as a fixed-size array; the other three are not
# implemented yet, so their flags stay false and the config over-claims
# nothing.
[rust_native_features]
const_generics = true
