# Example Rivet project configuration.
# `rivet build` reads this file from the directory that contains app.py.
# Unknown sections are ignored, so this file can grow ahead of the engine.

[project]
name = "my-api"
version = "0.1.0"
description = "A Rivet-powered API"
architecture = "monolith"

[environments]
development = { host = "127.0.0.1", port = 3000, log_level = "debug" }

# The Verifier enforces these rules at compile time, before code generation.
# The section was called `[gauntlet]`; the old name still loads with a warning.
[verifier]
max_complexity = 8            # E2042: cyclomatic complexity limit
stories_required = true       # E2045: every route needs a story ID
strict_type_checking = true   # E2046: the module must translate whole
duplicate_code = "blocker"    # E2043 outcome: warn or block
dead_code = "warning"         # E2044 outcome: warn or block

# Audit knobs for the quality index phase; not enforced by this build yet.
min_test_coverage = 80.0
surviving_mutants_allowed = 0

# Rust-native features, in the order later phases implement them.
[rust_native_features]
zero_copy_deserialization = false   # planned: borrowed &str bodies
raii_connections = false            # planned: connection pooling + RAII
compile_time_rbac = false           # planned: typestate auth layers
const_generics = false              # planned: List[T, N] fixed-size arrays
