[package]
name = "rivet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet command-line interface: parse Python DSL and transpile it to a Rust server"
readme = "../README.md"

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
rivet-core = { path = "../rivet-core" }

clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

rmcp = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The `remote` feature is required even for a local-only store: lancedb's
# job.rs unconditionally constructs Error::Http, which only exists under
# that feature (upstream 0.38.0).
lancedb = { version = "0.38.0", default-features = false, features = ["remote"] }
time = { workspace = true }
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "net", "signal", "time"] }
# The `rivet dev` proxy and its HMR tunnel: an axum server in front of the
# backend and the frontend dev server. `axum`, `hyper`, and `hyper-util` are
# already in the tree for plugins.
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
