# Enforce Verifier-style limits on the Rivet workspace itself.
# See https://doc.rust-lang.org/clippy/configuration.html for the schema.
too-many-arguments-threshold = 5
too-many-lines-threshold = 500
cognitive-complexity-threshold = 8

# Disallow unwrap/expect: every fallible path must be handled explicitly.
disallowed-methods = [
    "std::option::Option::unwrap",
    "std::result::Result::unwrap",
    "std::option::Option::expect",
    "std::result::Result::expect",
]
