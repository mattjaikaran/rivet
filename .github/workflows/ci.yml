name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "33.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Format Check
        run: cargo fmt --all -- --check
      
      - name: Clippy (Lints)
        run: cargo clippy -- -D warnings
      
      - name: Run Tests
        run: cargo test --workspace

  cargo-deny:
    name: Cargo Deny (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  gauntlet-check:
    name: Rivet Gauntlet on examples/basic
    runs-on: ubuntu-latest
    needs: rust-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "33.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Build the rivet CLI
        run: cargo build --release --bin rivet

      - name: Run the Gauntlet on the example
        run: ./target/release/rivet build examples/basic/app.py

      - name: Report the example MQI grade
        run: ./target/release/rivet audit --json examples/basic/app.py

  repo-self-checks:
    name: Repo Self-Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2

      - name: Build the self-check binaries
        run: cargo build -p constraint-tools

      - name: Check file-length ceilings
        run: ./target/debug/check-file-length

      - name: Check rule-module coherence
        run: ./target/debug/check-rule-modules

      - name: Check tracker coherence
        run: ./target/debug/check-tracker
